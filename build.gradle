// Puente propio (native/puente) entre Java y el núcleo de N64: atiende los callbacks que el núcleo hace desde su corrutina
def compilarPuente = tasks.register("compilarPuente", Exec) {
	description = "Compila el puente libretro del mod como DLL para Windows x64"
	def fuente = layout.projectDirectory.file("native/puente/libretro_puente.c")
	def gl = layout.projectDirectory.file("native/puente/contexto_gl.c")
	inputs.files(fuente, gl, layout.projectDirectory.file("native/puente/contexto_gl.h"))
	inputs.property("zig", zig)
	def salida = layout.buildDirectory.dir("nativosPuente")
	outputs.dir(salida)

	def dll = salida.map { it.file("natives/windows-x64/libretro_puente.dll").asFile }
	doFirst { dll.get().parentFile.mkdirs() }
	executable = zig.get()
	args "cc", "-target", "x86_64-windows-gnu", "-O2", "-std=c11", "-shared", "-fno-sanitize=all", "-Wall", "-Wno-format-security",
			"-o", dll.get().path, fuente.asFile.path, gl.asFile.path, "-lopengl32", "-lgdi32", "-luser32"
}

processClientResources {
	// zig también genera .lib y .pdb; al mod solo le hace falta la DLL
	from(compilarNucleo) {
		include "**/*.dll"
	}
	from(compilarNucleoNes) {
		include "**/*.dll"
	}
	from(extraerNucleoN64)
	from(extraerNucleoPs2)
	from(extraerNucleoPs3)
	from(extraerNucleoWii)
	from(extraerNucleo3ds)
	from(compilarPuente) {
		include "**/*.dll"
	}
}

// Prueba headless del núcleo, fuera de Minecraft: ./gradlew probarNucleo -Pbios=<ruta a gba_bios.bin>
sourceSets {
	pruebasNucleo {
		compileClasspath += client.compileClasspath + client.output + main.output
		runtimeClasspath += client.runtimeClasspath + client.output + main.output
	}
}

tasks.register("probarNes", JavaExec) {
	description = "Corre una ROM de prueba propia en el núcleo de NES y guarda la captura en build/pruebas-nes"
	classpath = sourceSets.pruebasNucleo.runtimeClasspath
	mainClass = "com.emumod.pruebas.PruebaNes"
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(17)
	}
	args layout.buildDirectory.dir("pruebas-nes").get().asFile.path
}

tasks.register("probarN64", JavaExec) {
	description = "Corre una ROM de prueba propia en el núcleo de N64 y guarda la captura en build/pruebas-n64"
	classpath = sourceSets.pruebasNucleo.runtimeClasspath
	mainClass = "com.emumod.pruebas.PruebaN64"
	jvmArgs "-Demumod.depurar=true"
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(17)
	}
	args layout.buildDirectory.dir("pruebas-n64").get().asFile.path
}

tasks.register("probarPs2", JavaExec) {
	description = "Arranca la BIOS de PS2 indicada sin disco y guarda capturas en build/pruebas-ps2"
	classpath = sourceSets.pruebasNucleo.runtimeClasspath
	mainClass = "com.emumod.pruebas.PruebaPs2"
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(17)
	}
	jvmArgs "-Demumod.depurar=true"
	def bios = providers.gradleProperty("bios").orElse("")
	def juego = providers.gradleProperty("juego").orElse("")
	def opciones = providers.gradleProperty("opciones").orElse("")
	// -Popciones=clave=valor,clave=valor (opciones del núcleo, para comparar velocidades)
	opciones.get().split(",").findAll { it.contains("=") }.each { jvmArgs "-Demumod.opcion.$it" }
	systemProperty "emumod.cuadros", providers.gradleProperty("cuadros").getOrElse("900")
	args layout.buildDirectory.dir("pruebas-ps2").get().asFile.path, bios.get(), juego.get()
}

tasks.register("probarPs3", JavaExec) {
	description = "Instala el firmware de PS3 indicado y arranca el menú de la consola (o un juego); capturas en build/pruebas-ps3"
	classpath = sourceSets.pruebasNucleo.runtimeClasspath
	mainClass = "com.emumod.pruebas.PruebaPs3"
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(17)
	}
	jvmArgs "-Demumod.depurar=true"
	// -Pjvm="-Xmx4096m ..." para probar con la memoria que le da el launcher a Minecraft; -Psalida=<carpeta> cambia la de la prueba
	providers.gradleProperty("jvm").getOrElse("").split(" ").findAll { !it.isEmpty() }.each { jvmArgs it }
	systemProperty "emumod.cuadros", providers.gradleProperty("cuadros").getOrElse("1200")
	args providers.gradleProperty("salida").getOrElse(layout.buildDirectory.dir("pruebas-ps3").get().asFile.path), providers.gradleProperty("firmware").getOrElse(""),
			providers.gradleProperty("juego").getOrElse("")
}

tasks.register("probarWii", JavaExec) {
	description = "Carga un juego de Wii en Dolphin (contexto OpenGL del puente) y guarda capturas en build/pruebas-wii"
	classpath = sourceSets.pruebasNucleo.runtimeClasspath
	mainClass = "com.emumod.pruebas.PruebaWii"
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(17)
	}
	jvmArgs "-Demumod.depurar=true"
	systemProperty "emumod.cuadros", providers.gradleProperty("cuadros").getOrElse("1800")
	args layout.buildDirectory.dir("pruebas-wii").get().asFile.path, providers.gradleProperty("juego").getOrElse("")
}

tasks.register("probarN3ds", JavaExec) {
	description = "Corre el programa de prueba propio de 3DS (o el juego indicado) en Citra; capturas en build/pruebas-3ds"
	classpath = sourceSets.pruebasNucleo.runtimeClasspath
	mainClass = "com.emumod.pruebas.PruebaDosPantallas"
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(17)
	}
	jvmArgs "-Demumod.depurar=true"
	// 0: los que hagan falta según el juego (400 con el programa de prueba)
	systemProperty "emumod.cuadros", providers.gradleProperty("cuadros").getOrElse("0")
	args layout.buildDirectory.dir("pruebas-3ds").get().asFile.path,
			providers.gradleProperty("juego").getOrElse(layout.projectDirectory.file("native/prueba3ds/prueba3ds.3dsx").asFile.path), "N3DS"
}

tasks.register("probarNucleo", JavaExec) {
	description = "Arranca el núcleo con la BIOS indicada y guarda capturas en build/pruebas-nucleo"
	classpath = sourceSets.pruebasNucleo.runtimeClasspath
	mainClass = "com.emumod.pruebas.PruebaNucleo"
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(17)
	}
	def salida = layout.buildDirectory.dir("pruebas-nucleo")
	def bios = providers.gradleProperty("bios").orElse("")
	args salida.get().asFile.path, bios.get()
}

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

sourceSets {
	// Pruebas automáticas en un servidor headless; no se incluyen en el jar del mod
	gametest {
		compileClasspath += main.compileClasspath + main.output
		runtimeClasspath += main.runtimeClasspath + main.output
	}
}

loom {
	splitEnvironmentSourceSets()

	accessWidenerPath = file("src/main/resources/emumod.accesswidener")

	mods {
		"emumod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Abre la pantalla del televisor, guarda run/screenshots/televisor_dev.png y cierra
		clientCaptura {
			client()
			name "Client (captura)"
			vmArg "-Demumod.dev.captura=true"
			vmArg "-Demumod.dev.rom=${providers.gradleProperty("devRom").getOrElse("vacio")}"
			vmArg "-Demumod.dev.velocidad=${providers.gradleProperty("devVelocidad").getOrElse("1")}"
			vmArg "-Demumod.dev.estados=${providers.gradleProperty("devEstados").getOrElse("false")}"
			vmArg "-Demumod.dev.pausa=${providers.gradleProperty("devPausa").getOrElse("false")}"
			vmArg "-Demumod.dev.consola=${providers.gradleProperty("devConsola").getOrElse("")}"
			vmArg "-Demumod.dev.botones=${providers.gradleProperty("devBotones").getOrElse("0")}"
			vmArg "-Demumod.dev.mundo=${providers.gradleProperty("devMundo").getOrElse("false")}"
			vmArg "-Demumod.dev.filtro=${providers.gradleProperty("devFiltro").getOrElse("ORIGINAL")}"
			vmArg "-Demumod.dev.bios_ps2=${providers.gradleProperty("devBiosPs2").getOrElse("")}"
			vmArg "-Demumod.dev.juego_wii=${providers.gradleProperty("devJuegoWii").getOrElse("")}"
			vmArg "-Demumod.dev.solo=${providers.gradleProperty("devSolo").getOrElse("")}"
			vmArg "-Demumod.dev.juego_doble=${providers.gradleProperty("devJuegoDoble").getOrElse("")}"
		}

		gametest {
			server()
			name "Game Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
			runDir "build/gametest"
			source sourceSets.gametest
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	// Avisos de licencia del código de terceros que va dentro de la DLL del núcleo
	from("licenses") {
		into "licenses"
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// El juego de desarrollo corre con Java 17 aunque Gradle use Java 25
tasks.withType(net.fabricmc.loom.task.AbstractRunTask).configureEach {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

// ---- Núcleo de GBA: SkyEmu (MIT), compilado sin modificar desde el submódulo native/SkyEmu ----
// Se compila con zig cc, que trae sus propios headers de C y no necesita Visual Studio ni el Windows SDK.
def zig = providers.gradleProperty("emumod.zig").orElse("zig")
def commitSkyEmu = providers.exec {
	commandLine "git", "-C", "native/SkyEmu", "rev-parse", "--short", "HEAD"
}.standardOutput.asText.map { it.trim() }

// ProcessBuilder no escapa comillas en Windows: ahí \" llega como comilla literal al compilador; en Linux (el build de
// GitHub) los argumentos pasan tal cual
def comilla = System.getProperty("os.name").toLowerCase().contains("windows") ? "\\\"" : "\""

def compilarNucleo = tasks.register("compilarNucleo", Exec) {
	description = "Compila el núcleo libretro de SkyEmu como DLL para Windows x64"
	def fuentes = layout.projectDirectory.dir("native/SkyEmu/src")
	def salida = layout.buildDirectory.dir("nativos")
	inputs.files(fileTree(fuentes) { include "*.h", "libretro.c", "shared.c", "localization.c" })
	inputs.property("zig", zig)
	inputs.property("commit", commitSkyEmu)
	outputs.dir(salida)

	def dll = salida.map { it.file("natives/windows-x64/skyemu_libretro.dll").asFile }
	doFirst { dll.get().parentFile.mkdirs() }
	executable = zig.get()
	args "cc", "-target", "x86_64-windows-gnu", "-O3", "-std=c11", "-shared", "-fno-sanitize=all", "-w",
			"-DSE_PLATFORM_WINDOWS=1", "-DUSE_SDL=1",
			"-DGIT_COMMIT_HASH=${comilla}${commitSkyEmu.get()}${comilla}", "-DGIT_BRANCH=${comilla}main${comilla}", "-DGIT_TAG=${comilla}${commitSkyEmu.get()}${comilla}",
			"-o", dll.get().path,
			fuentes.file("libretro.c").asFile.path, fuentes.file("shared.c").asFile.path, fuentes.file("localization.c").asFile.path
}

// ---- Núcleo de NES: QuickNES (emulador LGPL-2.1, adaptador libretro GPL-2), sin modificar desde native/QuickNES ----
def commitQuickNes = providers.exec {
	commandLine "git", "-C", "native/QuickNES", "rev-parse", "--short", "HEAD"
}.standardOutput.asText.map { it.trim() }

def compilarNucleoNes = tasks.register("compilarNucleoNes", Exec) {
	description = "Compila el núcleo libretro de QuickNES como DLL para Windows x64"
	def raiz = layout.projectDirectory.dir("native/QuickNES")
	// Las mismas fuentes que lista Makefile.common del núcleo
	def fuentes = ["libretro/libretro.cpp"] + fileTree(raiz.dir("nes_emu")) { include "*.cpp" }.files.collect { "nes_emu/" + it.name }.sort()
	inputs.files(fileTree(raiz) { include "libretro/**", "nes_emu/**" })
	inputs.property("zig", zig)
	inputs.property("commit", commitQuickNes)
	def salida = layout.buildDirectory.dir("nativosNes")
	outputs.dir(salida)

	def dll = salida.map { it.file("natives/windows-x64/quicknes_libretro.dll").asFile }
	doFirst { dll.get().parentFile.mkdirs() }
	workingDir raiz.asFile
	executable = zig.get()
	args(["c++", "-target", "x86_64-windows-gnu", "-O2", "-std=gnu++11", "-shared", "-fno-sanitize=all", "-w",
			"-DNDEBUG", "-D__LIBRETRO__",
			"-I.", "-Ines_emu", "-Ilibretro", "-Ilibretro/libretro-common/include",
			"-o", dll.get().path] + fuentes)
}


// ---- Núcleo de N64: Mupen64Plus-Next (GPL-2), DLL oficial ya compilada por el buildbot de libretro ----
// Compilarlo acá pediría NASM y los headers de OpenGL; se usa la DLL nightly del commit que está en el submódulo
// native/Mupen64PlusNext (su código fuente exacto) y se verifica que sea la misma que se bajó
def extraerNucleoN64 = tasks.register("extraerNucleoN64", Copy) {
	description = "Extrae la DLL de Mupen64Plus-Next (buildbot de libretro) para Windows x64"
	def zip = layout.projectDirectory.file("native/Mupen64PlusNext-win64/mupen64plus_next_libretro.dll.zip")
	inputs.file(zip)
	doFirst {
		def hash = java.security.MessageDigest.getInstance("SHA-256").digest(zip.asFile.bytes).encodeHex().toString()
		if (hash != "6ba65e218eddd0cbebdbf0d5e81a5c739b0d4e932a2091d10134e6da123a8b01") {
			throw new GradleException("La DLL de Mupen64Plus-Next no es la esperada (SHA-256 ${hash})")
		}
	}
	from(zipTree(zip)) {
		include "mupen64plus_next_libretro.dll"
		into "natives/windows-x64"
	}
	into layout.buildDirectory.dir("nativosN64")
}

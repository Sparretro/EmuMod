# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Mod Properties
version=2.1.1
group=com.emumod

# Dependencies
fabric_api_version=0.92.12+1.20.1

# Rutas propias de cada PC: van en el gradle.properties de tu usuario (~/.gradle/gradle.properties), no acá:
#   org.gradle.java.home=<JDK 25>                    (Loom 1.18 lo necesita para ejecutar Gradle; el mod se compila con --release 17)
#   org.gradle.java.installations.paths=<JDK 17>     (para el juego de desarrollo, como el launcher de 1.20.1)
#   emumod.zig=<zig.exe>                             (compilador de C; no hace falta si zig está en el PATH)
